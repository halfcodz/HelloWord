<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="언니가 여동생에게 영어 단어 시험을 내는 앱">

  <!-- 모바일 사파리: 기기 폭 기준 렌더링 + 확대 방지 + 노치 대응 -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- 상태바/테마 색 (앱에서 테마 변경 시 갱신됨) -->
  <meta name="theme-color" content="#F7FAFF">

  <!-- iOS 홈화면 추가(PWA) 대응 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- 화면이 상태바(다이나믹 아일랜드) 아래까지 이어지게 한다.
       그러지 않으면 위쪽에 배경이 안 깔린 흰 띠가 생긴다. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HelloWord">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- 폰트 다운로드를 미리 연결해 첫 로딩을 앞당긴다 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <title>HelloWord</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      /* 앱 배경과 같은 색. 상태바 뒤와 스크롤 튕김 영역까지 이 색이 보인다. */
      background: linear-gradient(180deg, #F7FAFF 0%, #EFF6FF 100%);
      background-attachment: fixed;
      overscroll-behavior: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #F7FAFF 0%, #EFF6FF 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Segoe UI", Roboto, sans-serif;
      color: #0F172A;
    }
    #loading .logo {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      background: #2563EB;
    }
    #loading .title {
      margin-top: 18px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #0F172A;
    }
    #loading .sub { margin-top: 6px; font-size: 14px; font-weight: 600; color: #5D6580; }
    #loading .spinner {
      margin-top: 28px;
      width: 34px;
      height: 34px;
      border: 3px solid rgba(0, 196, 140, 0.2);
      border-top-color: #00C48C;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">📖</div>
    <div class="title">HelloWord</div>
    <div class="sub">자매 영어 단어 시험</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Flutter 첫 프레임이 그려지면 로딩 화면 제거.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
